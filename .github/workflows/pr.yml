name: Pull Request

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Check build
        run: npm run build

      - name: Check package.json formatting
        run: |
          node -e "
            const pkg = require('./package.json');
            const formatted = JSON.stringify(pkg, null, 2) + '\n';
            const fs = require('fs');
            const current = fs.readFileSync('./package.json', 'utf8');
            if (formatted !== current) {
              console.error('package.json is not properly formatted');
              process.exit(1);
            } else {
              console.log('package.json formatting is correct');
            }
          "

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check bundle size
        run: |
          if [ -d "dist" ]; then
            echo "Bundle size information:"
            du -sh dist/
            find dist -name "*.js" -exec wc -l {} + | tail -1
          else
            echo "No dist directory found after build"
          fi

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [validate, size-check]
    if: always()
    
    steps:
      - name: Comment success
        if: needs.validate.result == 'success' && needs.size-check.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'All checks passed! This PR is ready for review.'
            })

      - name: Comment failure
        if: needs.validate.result == 'failure' || needs.size-check.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Some checks failed. Please review the errors and fix them before merging.'
            })
