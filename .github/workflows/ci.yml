name: CI/CD Pipeline

on:
  push:
    branches: [ 
      main, 
      develop, 
      'release/*', 
      'feature/*', 
      'hotfix/*', 
      'bugfix/*' 
    ]

env:
  NODE_VERSION: '18.19.1'

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for vulnerabilities
        run: npm audit --audit-level=critical

  versionate:
    name: Version Management & Release
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Verify build artifacts
        run: |
          echo "🔍 Verifying build artifacts..."
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after download"
            ls -la
            exit 1
          fi
          echo "Dist directory contents:"
          ls -la dist/
          echo "Build artifacts verified successfully"

      - name: Test version manager
        run: npm run version:test

      - name: Update version
        run: npm run version:update ${{ github.ref_name }}

      - name: Generate tag name
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Commit version change
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: update version to ${{ steps.tag.outputs.version }} [skip ci]"
            git push
          fi

      - name: Create Git tag
        run: |
          # Configure git for the action
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          VERSION=${{ steps.tag.outputs.version }}
          TAG_NAME="v$VERSION"
          echo "Creating tag: $TAG_NAME"
          
          # Check if tag already exists
          if git tag -l | grep -q "^$TAG_NAME$"; then
            echo "Tag $TAG_NAME already exists, skipping creation"
          else
            # Create annotated tag
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME"
          fi

      - name: Create build archive
        run: |
          # Verify dist directory exists
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            ls -la
            exit 1
          fi
          
          echo "Creating build archive from dist directory..."
          cd dist
          zip -r ../evex-sdk-build.zip .
          cd ..
          ls -la evex-sdk-build.zip
          echo "Build archive created successfully"

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges ${LAST_TAG}..HEAD)
          fi
          
          # Create changelog
          cat > CHANGELOG.md << EOF
          ## What's Changed
          
          $COMMITS
          
          **Full Changelog**: https://github.com/evex-finance/evex-sdk/compare/${LAST_TAG}...v${{ steps.tag.outputs.version }}
          EOF
          
          echo "Generated changelog for release"

      - name: Upload updated package.json
        uses: actions/upload-artifact@v4
        with:
          name: updated-package
          path: package.json
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: v${{ steps.tag.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          files: |
            evex-sdk-build.zip
            package.json

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: versionate
    # Only for stable releases on main (no pre-release versions)
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Download updated package.json
        uses: actions/download-artifact@v4
        with:
          name: updated-package
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify version before publish
        run: |
          echo "Verifying package.json version before publish..."
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"
          
          # Verify it's a stable version (no pre-release suffixes)
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Error: Cannot publish pre-release version $VERSION to NPM"
            exit 1
          fi

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Check if package is already published
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          
          if npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null; then
            echo "Package $PACKAGE_NAME@$VERSION already published to NPM"
          else
            echo "Publishing $PACKAGE_NAME@$VERSION to NPM"
            npm publish
          fi

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [versionate, publish-npm]
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Notify release success
        if: needs.versionate.result == 'success'
        run: |
          echo "Successfully created release v${{ steps.get_version.outputs.version }}"
          echo "GitHub Release: https://github.com/evex-finance/evex-sdk/releases/tag/v${{ steps.get_version.outputs.version }}"
          
      - name: Notify NPM publish success
        if: needs.publish-npm.result == 'success'
        run: |
          echo "Successfully published to NPM"
          echo "NPM Package: https://www.npmjs.com/package/evex-sdk"
          
      - name: Notify NPM skipped
        if: needs.publish-npm.result == 'skipped'
        run: |
          echo "NPM publish skipped (not a stable release on main)"
          
      - name: Notify failures
        if: needs.versionate.result == 'failure' || needs.publish-npm.result == 'failure'
        run: |
          echo "Release process failed"
          echo "Version job result: ${{ needs.versionate.result }}"
          echo "NPM publish job result: ${{ needs.publish-npm.result }}"
          
      - name: Notify summary
        run: |
          echo "Release Summary:"
          echo "- Version job: ${{ needs.versionate.result }}"
          echo "- NPM publish job: ${{ needs.publish-npm.result }}"
          echo "- Current version: ${{ steps.get_version.outputs.version }}"