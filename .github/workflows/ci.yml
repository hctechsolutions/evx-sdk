name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'release/*', 'hotfix/*', 'bugfix/*' ]
    tags-ignore: ['v*']
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.19.1'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7

  version:
    name: Version Management
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    
    steps:
      - name: Check if this is a version commit
        id: check-version-commit
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"chore: update version to"* ]]; then
            echo "This is a version update commit. Skipping to prevent recursive execution."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "This is a regular commit. Proceeding with version management."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-version-commit.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          token: ${{ secrets.RELEASE_CREATOR_TOKEN }}

      - name: Setup Node.js
        if: steps.check-version-commit.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-version-commit.outputs.skip != 'true'
        run: npm ci

      - name: Test version manager
        if: steps.check-version-commit.outputs.skip != 'true'
        run: npm run version:test

      - name: Update version
        if: steps.check-version-commit.outputs.skip != 'true'
        run: npm run version:update ${{ github.ref_name }}

      - name: Generate tag name
        if: steps.check-version-commit.outputs.skip != 'true'
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Commit version change
        if: steps.check-version-commit.outputs.skip != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: update version to ${{ steps.tag.outputs.version }}"
            git push
          fi

      - name: Create Git tag
        if: steps.check-version-commit.outputs.skip != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          TAG_NAME="v$VERSION"
          if git tag -l | grep -q "^$TAG_NAME$"; then
            echo "Tag $TAG_NAME already exists"
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            # Use PAT token for pushing tags to trigger release workflow
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for vulnerabilities
        run: npm audit --audit-level=critical